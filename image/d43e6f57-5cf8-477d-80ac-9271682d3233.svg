<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="360" viewBox="0 0 600 360">
  <title>Institut français du Congo</title>
  <desc>Version vectorielle de présentation. Les marques et emblèmes appartiennent à leurs détenteurs respectifs.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0b1736" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="600" height="360" rx="24" fill="#ffffff"/>
  <g transform="translate(120 35)">
    <rect x="0" y="0" width="360" height="290" fill="#4662a8"/>
    <rect x="18" y="18" width="324" height="254" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="180" y="104" text-anchor="middle" fill="#ffffff" font-family="Arial Narrow, Arial, sans-serif" font-size="51" font-weight="700" letter-spacing="-2">INSTITUT</text>
    <text x="180" y="157" text-anchor="middle" fill="#ffffff" font-family="Arial Narrow, Arial, sans-serif" font-size="51" font-weight="700" letter-spacing="-2">FRANÇAIS</text>
    <line x1="60" y1="181" x2="300" y2="181" stroke="#ffffff" stroke-width="2"/>
    <text x="180" y="218" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="2">CONGO</text>
    <text x="180" y="246" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="2">BRAZZAVILLE</text>
  </g>
</svg>
